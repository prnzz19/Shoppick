name: shoppick_mobile
description: SHOPPICK marketplace mobile client for the Laravel SHOPPICK backend.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.0
  google_maps_flutter: 2.18.2
  google_sign_in: ^7.2.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/shoppick_logo.svg
    - assets/images/shoppick-mark.png
    - assets/images/shoppick-wordmark-hoppick.png
